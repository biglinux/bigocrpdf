[project]
name = "bigocrpdf"
version = "3.0.0"
description = "Add OCR to your PDF documents to make them searchable - Powered by RapidOCR"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
authors = [
    {name = "BigLinux Team", email = "contact@biglinux.com.br"}
]
keywords = ["ocr", "pdf", "gtk", "libadwaita", "biglinux"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
]
# Floors are the oldest versions the test suite actually exercises. Claiming
# support for older ones is a promise nothing checks: OpenCV 4 and 5 disagree
# on the shape HoughLinesP returns, and Pillow dropped Image.ANTIALIAS in 10.
# tests/test_library_contracts.py pins the behaviours these floors imply.
dependencies = [
    "PyGObject>=3.42.0",
    "pycairo>=1.20.0",
    # RapidOCR engine
    "rapidocr>=3.9.0",
    # PDF processing
    "pikepdf>=10.0.0",
    "reportlab>=4.0.0",
    # Image processing
    "opencv-python>=5.0.0",
    "Pillow>=11.0.0",
    "numpy>=2.0.0",
    # Dewarp dependencies
    "scipy>=1.11.0",
    # ODF export
    "odfpy>=1.4.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff"]



[project.scripts]
bigocrpdf-cli = "bigocrpdf.cli:main"

[project.gui-scripts]
bigocrpdf = "bigocrpdf:main"
bigocrimage = "bigocrpdf:main_image"

[project.urls]
Homepage = "https://www.biglinux.com.br"
Repository = "https://github.com/biglinux/bigocrpdf"
Issues = "https://github.com/biglinux/bigocrpdf/issues"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bigocrpdf = [
    "resources/*.css",
    "resources/illustrations/*.svg",
    "resources/icontheme/*/index.theme",
    "resources/icontheme/*/*/*/*.svg",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]
extend-exclude = [
    ".bigocrpdf-cpython-3.14",
    ".bigocrpdf-debian-runtime",
    ".bigocrpdf-venv",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP"]
ignore = ["E501", "E402"]  # E402: Module level import not at top (needed for gi.require_version)

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests", "benchmarks/tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
# --strict-markers turns a misspelled marker into an error instead of a test
# that silently always runs.  The -m expression selects the fast layer; an
# explicit -m on the command line overrides it, which is how tools/quality.sh
# and tools/benchmark.sh reach the slower layers.
addopts = "-v --tb=short --strict-markers -m 'not slow and not real_ocr and not benchmark and not network'"
pythonpath = ["src"]
markers = [
    "slow: needs LibreOffice or rasterization; seconds per test",
    "real_ocr: runs the actual OCR engine and needs the models on disk; minutes",
    "benchmark: drives the benchmark harness end to end; very slow",
    "network: downloads external datasets",
]
